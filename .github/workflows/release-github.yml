name: Publish GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish a release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without a release the repo sidebar shows only a tag count, never the
      # version. Notes come from the matching CHANGELOG section.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          notes=$(awk -v v="## ${tag#v}" '$0==v {f=1; next} /^## / {f=0} f' CHANGELOG.md)

          if [ -n "$notes" ]; then
            gh release create "$tag" --title "Patina $tag" --notes "$notes"
          else
            gh release create "$tag" --title "Patina $tag" --generate-notes
          fi
