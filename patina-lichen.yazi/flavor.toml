# Patina Lichen, a Yazi flavor.
# Ported from the Patina editor theme (Lichen variant).
#
# bg          #d5dace   surface     #cbcfc4   tab bg   #d2d6cb
# fg          #393a34   muted       #70746a   border   #80857a
# green       #34644d   primary accent
# green soft  #2f5419
# cyan        #2b6361
# rose        #864b3f
# yellow      #7a6821
# red         #8c4646
# blue/info   #36616e
# orange      #805031
# hint        #5e7052   error    #a33333

[mgr]
marker_copied   = { fg = "#34644d", bg = "#34644d" }
marker_cut      = { fg = "#8c4646", bg = "#8c4646" }
marker_marked   = { fg = "#2b6361", bg = "#2b6361" }
marker_selected = { fg = "#7a6821", bg = "#7a6821" }

cwd = { fg = "#2b6361" }

find_keyword  = { fg = "#7a6821", bg = "#d5dace" }
find_position = {}

count_copied   = { fg = "#d5dace", bg = "#34644d" }
count_cut      = { fg = "#d5dace", bg = "#8c4646" }
count_selected = { fg = "#d5dace", bg = "#7a6821" }

border_symbol = "│"
border_style  = { fg = "#80857a" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { reversed = true }

[tabs]
active   = { fg = "#d5dace", bg = "#34644d" }
inactive = { fg = "#2f5419", bg = "#cbcfc4" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#d5dace", bg = "#34644d" }
normal_alt  = { fg = "#2f5419", bg = "#cbcfc4" }
select_main = { fg = "#d5dace", bg = "#7a6821" }
select_alt  = { fg = "#7a6821", bg = "#cbcfc4" }
unset_main  = { fg = "#d5dace", bg = "#864b3f" }
unset_alt   = { fg = "#864b3f", bg = "#cbcfc4" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall   = { fg = "#393a34", bg = "#cbcfc4" }

progress_label  = { fg = "#34644d", bold = true }
progress_normal = { fg = "#afb5a8", bg = "#d5dace" }
progress_error  = { fg = "#a33333", bg = "#d5dace" }

perm_type  = { fg = "#34644d" }
perm_read  = { fg = "#7a6821" }
perm_write = { fg = "#8c4646" }
perm_exec  = { fg = "#2b6361" }
perm_sep   = { fg = "#70746a" }

[pick]
border   = { fg = "#34644d" }
active   = { fg = "#7a6821", bold = true }
inactive = {}

[input]
border   = { fg = "#34644d" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#34644d" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#34644d" }
title   = {}
hovered = { fg = "#7a6821" }

[which]
cols            = 2
separator       = " - "
separator_style = { fg = "#70746a" }
mask            = { bg = "#d5dace" }
rest            = { fg = "#70746a" }
cand            = { fg = "#34644d" }
desc            = { fg = "#5e7052" }

[help]
on      = { fg = "#2b6361" }
run     = { fg = "#34644d" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#d5dace", bg = "#393a34" }

[notify]
title_info  = { fg = "#34644d" }
title_warn  = { fg = "#7a6821" }
title_error = { fg = "#a33333" }

[filetype]
rules = [
    { mime = "image/*", fg = "#7a6821" },
    { mime = "{audio,video}/*", fg = "#864b3f" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#8c4646" },
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#2b6361" },

    { url = "*", is = "orphan", fg = "#a33333" },
    { url = "*", is = "exec", fg = "#2f5419" },

    { url = "*", fg = "#393a34" },
    { url = "*/", fg = "#34644d" },
]
