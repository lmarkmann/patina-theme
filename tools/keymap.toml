[[vscode.tokenColors]]
scope = ["comment", "punctuation.definition.comment", "string.comment"]
settings_order = ["foreground"]
foreground = "comment"

[[vscode.tokenColors]]
scope = ["punctuation", "delimiter", "delimiter.bracket", "meta.brace", "meta.tag.block.any.html", "meta.tag.inline.any.html", "meta.tag.structure.input.void.html", "meta.type.annotation", "storage.type.function.arrow", "meta.objectliteral.ts"]
settings_order = ["foreground"]
foreground = "punctuation"

[[vscode.tokenColors]]
scope = ["punctuation.definition.string"]
settings_order = ["foreground"]
foreground = "string_punctuation"

[[vscode.tokenColors]]
scope = ["punctuation.definition.template-expression", "punctuation.section.embedded"]
settings_order = ["foreground"]
foreground = "operator"

[[vscode.tokenColors]]
scope = ["keyword", "storage.type.class.jsdoc"]
settings_order = ["foreground"]
foreground = "accent"

[[vscode.tokenColors]]
scope = ["keyword.control.import", "keyword.control.from", "keyword.control.export", "keyword.import", "keyword.other.import"]
settings_order = ["foreground"]
foreground = "comment"

[[vscode.tokenColors]]
scope = ["keyword.control", "keyword.control.flow", "keyword.control.conditional", "keyword.control.loop", "keyword.control.return", "keyword.control.trycatch"]
settings_order = ["foreground"]
foreground = "red"

[[vscode.tokenColors]]
scope = ["keyword.operator", "keyword.operator.assignment.compound", "keyword.operator.rest", "keyword.operator.spread", "keyword.operator.ternary", "keyword.other.unit"]
settings_order = ["foreground"]
foreground = "operator"

[[vscode.tokenColors]]
scope = ["keyword.operator.relational", "keyword.operator.comparison", "keyword.operator.assignment", "keyword.operator.type.annotation", "keyword.operator.type"]
settings_order = ["foreground"]
foreground = "operator_relational"

[[vscode.tokenColors]]
scope = ["storage", "storage.type", "storage.modifier"]
settings_order = ["foreground"]
foreground = "red"

[[vscode.tokenColors]]
scope = ["storage.type.function", "storage.type.class", "storage.type.interface", "storage.type.enum", "storage.type.struct"]
settings_order = ["foreground"]
foreground = "accent"

[[vscode.tokenColors]]
scope = ["string", "string punctuation.section.embedded source", "attribute.value"]
settings_order = ["foreground"]
foreground = "string_plain"

[[vscode.tokenColors]]
scope = ["string.regexp", "source.regexp"]
settings_order = ["foreground"]
foreground = "constant"

[[vscode.tokenColors]]
scope = "string variable"
settings_order = ["foreground"]
foreground = "string"

[[vscode.tokenColors]]
scope = ["entity.name.function", "support.function"]
settings_order = ["foreground"]
foreground = "olive"

[[vscode.tokenColors]]
scope = ["entity.name.function.macro", "support.function.macro"]
settings_order = ["foreground"]
foreground = "red"

[[vscode.tokenColors]]
scope = ["entity", "entity.name"]
settings_order = ["foreground"]
foreground = "olive"

[[vscode.tokenColors]]
scope = ["entity.name.tag", "tag.html"]
settings_order = ["foreground"]
foreground = "cyan"

[[vscode.tokenColors]]
scope = ["entity.name.type", "support.type", "support.type.primitive", "support.type.builtin"]
settings_order = ["foreground"]
foreground = "cyan"

[[vscode.tokenColors]]
scope = ["entity.name.namespace", "entity.name.module"]
settings_order = ["foreground"]
foreground = "cyan"

[[vscode.tokenColors]]
scope = ["entity.other.attribute-name", "invalid.deprecated.entity.other.attribute-name.html"]
settings_order = ["foreground"]
foreground = "attribute"

[[vscode.tokenColors]]
scope = ["variable", "identifier"]
settings_order = ["foreground"]
foreground = "variable"

[[vscode.tokenColors]]
scope = ["variable.parameter", "variable.parameter.function"]
settings_order = ["foreground"]
foreground = "parameter"

[[vscode.tokenColors]]
scope = "variable.language"
settings_order = ["foreground"]
foreground = "red"

[[vscode.tokenColors]]
scope = ["variable.other.property", "variable.other.member", "variable.other.object.property", "meta.object-literal.key"]
settings_order = ["foreground"]
foreground = "variable"

[[vscode.tokenColors]]
scope = ["variable.other.enummember"]
settings_order = ["foreground"]
foreground = "cyan"

[[vscode.tokenColors]]
scope = ["property", "meta.property-name", "support.type.property-name", "entity.name.tag.yaml", "attribute.name"]
settings_order = ["foreground"]
foreground = "parameter"

[[vscode.tokenColors]]
scope = ["punctuation.support.type.property-name"]
settings_order = ["foreground"]
foreground = "parameter_punctuation"

[[vscode.tokenColors]]
scope = "support"
settings_order = ["foreground"]
foreground = "parameter"

[[vscode.tokenColors]]
scope = ["constant", "entity.name.constant", "support.constant"]
settings_order = ["foreground"]
foreground = "constant"

[[vscode.tokenColors]]
scope = ["constant.numeric", "number"]
settings_order = ["foreground"]
foreground = "teal"

[[vscode.tokenColors]]
scope = "constant.character"
settings_order = ["foreground"]
foreground = "string"

[[vscode.tokenColors]]
scope = "constant.character.escape"
settings_order = ["foreground"]
foreground = "red"

[[vscode.tokenColors]]
scope = ["constant.language"]
settings_order = ["foreground"]
foreground = "constant"

[[vscode.tokenColors]]
scope = ["constant.language.boolean"]
settings_order = ["foreground"]
foreground = "constant"

[[vscode.tokenColors]]
scope = ["constant.language.null", "constant.language.undefined"]
settings_order = ["foreground"]
foreground = "red"

[[vscode.tokenColors]]
scope = "namespace"
settings_order = ["foreground"]
foreground = "cyan"

[[vscode.tokenColors]]
scope = "meta.module-reference"
settings_order = ["foreground"]
foreground = "accent"

[[vscode.tokenColors]]
scope = "entity.name.label"
settings_order = ["foreground"]
foreground = "string"

[[vscode.tokenColors]]
scope = ["markup.heading", "markup.heading entity.name"]
settings_order = ["fontStyle", "foreground"]
foreground = "olive"
fontStyle = "bold"

[[vscode.tokenColors]]
scope = "markup.bold"
settings_order = ["fontStyle", "foreground"]
foreground = "fg"
fontStyle = "bold"

[[vscode.tokenColors]]
scope = "markup.italic"
settings_order = ["fontStyle", "foreground"]
foreground = "fg"
fontStyle = "italic"

[[vscode.tokenColors]]
scope = "markup.strikethrough"
settings_order = ["fontStyle"]
fontStyle = "strikethrough"

[[vscode.tokenColors]]
scope = "markup.quote"
settings_order = ["foreground"]
foreground = "cyan"

[[vscode.tokenColors]]
scope = "markup.raw"
settings_order = ["foreground"]
foreground = "attribute"

[[vscode.tokenColors]]
scope = ["markup.underline.link.markdown", "markup.underline.link.image.markdown"]
settings_order = ["foreground", "fontStyle"]
foreground = "accent"
fontStyle = "underline"

[[vscode.tokenColors]]
scope = ["constant.other.reference.link", "string.other.link", "punctuation.definition.string.begin.markdown", "punctuation.definition.string.end.markdown"]
settings_order = ["foreground"]
foreground = "string"

[[vscode.tokenColors]]
scope = "punctuation.definition.list.begin.markdown"
settings_order = ["foreground"]
foreground = "red"

[[vscode.tokenColors]]
scope = ["markup.deleted", "meta.diff.header.from-file", "punctuation.definition.deleted"]
settings_order = ["foreground", "background"]
foreground = "red"
background = "deleted_background"

[[vscode.tokenColors]]
scope = ["markup.inserted", "meta.diff.header.to-file", "punctuation.definition.inserted"]
settings_order = ["foreground", "background"]
foreground = "accent"
background = "editor_focused_stack_frame_highlight_background"

[[vscode.tokenColors]]
scope = ["markup.changed", "punctuation.definition.changed"]
settings_order = ["foreground", "background"]
foreground = "orange"
background = "conflict_background"

[[vscode.tokenColors]]
scope = ["markup.ignored", "markup.untracked"]
settings_order = ["foreground"]
foreground = "guide"

[[vscode.tokenColors]]
scope = "meta.diff.range"
settings_order = ["foreground", "fontStyle"]
foreground = "cyan"
fontStyle = "bold"

[[vscode.tokenColors]]
scope = "meta.diff.header"
settings_order = ["foreground"]
