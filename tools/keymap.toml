[[vscode.tokenColors]]
scope = "invalid.broken"
settings_order = ["fontStyle", "foreground"]
foreground = "error"
fontStyle = "italic"

[[vscode.tokenColors]]
scope = "invalid.deprecated"
settings_order = ["fontStyle", "foreground"]
foreground = "error"
fontStyle = "italic"

[[vscode.tokenColors]]
scope = "invalid.illegal"
settings_order = ["fontStyle", "foreground"]
foreground = "error"
fontStyle = "italic"

[[vscode.tokenColors]]
scope = "invalid.unimplemented"
settings_order = ["fontStyle", "foreground"]
foreground = "error"
