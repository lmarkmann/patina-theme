# Patina Dark, a Yazi flavor.
# Ported from the Patina editor theme (Dark variant).
#
# bg          #121212   surface     #1a1a1a   tab bg   #161616
# fg          #dbd7ca   muted       #555555   border   #585858
# green       #4d9375   primary accent
# green soft  #9aba7a
# cyan        #5da9a7
# rose        #d29384
# yellow      #e6cc77
# red         #cb7676
# blue/info   #6db3c2
# orange      #bd976a
# hint        #7d857c   error    #e05561

[mgr]
marker_copied   = { fg = "#4d9375", bg = "#4d9375" }
marker_cut      = { fg = "#cb7676", bg = "#cb7676" }
marker_marked   = { fg = "#5da9a7", bg = "#5da9a7" }
marker_selected = { fg = "#e6cc77", bg = "#e6cc77" }

cwd = { fg = "#5da9a7" }

find_keyword  = { fg = "#e6cc77", bg = "#121212" }
find_position = {}

count_copied   = { fg = "#121212", bg = "#4d9375" }
count_cut      = { fg = "#121212", bg = "#cb7676" }
count_selected = { fg = "#121212", bg = "#e6cc77" }

border_symbol = "│"
border_style  = { fg = "#585858" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { reversed = true }

[tabs]
active   = { fg = "#121212", bg = "#4d9375" }
inactive = { fg = "#9aba7a", bg = "#1a1a1a" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#121212", bg = "#4d9375" }
normal_alt  = { fg = "#9aba7a", bg = "#1a1a1a" }
select_main = { fg = "#121212", bg = "#e6cc77" }
select_alt  = { fg = "#e6cc77", bg = "#1a1a1a" }
unset_main  = { fg = "#121212", bg = "#d29384" }
unset_alt   = { fg = "#d29384", bg = "#1a1a1a" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall   = { fg = "#dbd7ca", bg = "#1a1a1a" }

progress_label  = { fg = "#4d9375", bold = true }
progress_normal = { fg = "#3a3a3a", bg = "#121212" }
progress_error  = { fg = "#e05561", bg = "#121212" }

perm_type  = { fg = "#4d9375" }
perm_read  = { fg = "#e6cc77" }
perm_write = { fg = "#cb7676" }
perm_exec  = { fg = "#5da9a7" }
perm_sep   = { fg = "#555555" }

[pick]
border   = { fg = "#4d9375" }
active   = { fg = "#e6cc77", bold = true }
inactive = {}

[input]
border   = { fg = "#4d9375" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#4d9375" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#4d9375" }
title   = {}
hovered = { fg = "#e6cc77" }

[which]
cols            = 2
separator       = " - "
separator_style = { fg = "#555555" }
mask            = { bg = "#121212" }
rest            = { fg = "#555555" }
cand            = { fg = "#4d9375" }
desc            = { fg = "#7d857c" }

[help]
on      = { fg = "#5da9a7" }
run     = { fg = "#4d9375" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#121212", bg = "#dbd7ca" }

[notify]
title_info  = { fg = "#4d9375" }
title_warn  = { fg = "#e6cc77" }
title_error = { fg = "#e05561" }

[filetype]
rules = [
    { mime = "image/*", fg = "#e6cc77" },
    { mime = "{audio,video}/*", fg = "#d29384" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cb7676" },
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#5da9a7" },

    { url = "*", is = "orphan", fg = "#e05561" },
    { url = "*", is = "exec", fg = "#9aba7a" },

    { url = "*", fg = "#dbd7ca" },
    { url = "*/", fg = "#4d9375" },
]
